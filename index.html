<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Stunden</title>
<style>
  :root { --blau:#1f4e79; --hell:#eaf1f8; --grau:#6b6b6b; --ok:#1e7b34; --fehler:#b00020; }
  * { box-sizing: border-box; }
  body { font-family: Verdana, Geneva, sans-serif; margin: 0; padding: 12px; background: #fff; color: #222; font-size: 16px; max-width: 560px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; color: var(--blau); }
  h2 { font-size: 16px; margin: 24px 0 8px; color: var(--blau); }
  label { display: block; font-size: 13px; color: var(--grau); margin-bottom: 4px; }
  input, select, button { font-family: inherit; font-size: 18px; }
  input[type=date], input[type=time], input[type=number], select {
    width: 100%; height: 56px; padding: 0 12px; border: 2px solid #b8c4d0; border-radius: 10px; background: #fff; }
  input:disabled, select:disabled { background: #ddd; color: #888; }
  .zeile { display: grid; grid-template-columns: 1fr 110px; gap: 8px; align-items: end; margin-bottom: 12px; }
  button { min-height: 56px; border: 0; border-radius: 10px; background: var(--hell); color: var(--blau); font-weight: bold; cursor: pointer; padding: 0 14px; }
  button:active { filter: brightness(0.92); }
  .gross { width: 100%; min-height: 68px; background: var(--blau); color: #fff; font-size: 20px; margin-top: 8px; }
  .sek { background: #fff; border: 2px solid var(--blau); }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ziel[aria-pressed=true] { background: var(--blau); color: #fff; }
  #meldung { margin-top: 12px; padding: 12px; border-radius: 10px; display: none; font-size: 15px; }
  #meldung.ok { display: block; background: #e3f4e7; color: var(--ok); }
  #meldung.fehler { display: block; background: #fbe4e8; color: var(--fehler); }
  #meldung.info { display: block; background: var(--hell); color: var(--blau); }
  .eintrag { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid #ddd; }
  .eintrag .t { font-size: 13px; color: var(--grau); }
  .eintrag button { min-height: 44px; font-size: 14px; }
  .klein { font-size: 12px; color: var(--grau); margin-top: 8px; }
</style>
</head>
<body>
<h1>Stundenerfassung</h1>

<label for="datum">Datum</label>
<input type="date" id="datum" style="margin-bottom:12px">

<label for="abw">Abwesenheit</label>
<select id="abw" style="margin-bottom:12px">
  <option value="">– keine –</option>
  <option value="Urlaub">Urlaub</option>
  <option value="Krank">Krank</option>
</select>

<div id="zeiten">
  <div class="zeile"><div><label for="haus">Haus verlassen</label><input type="time" id="haus"></div><button type="button" data-jetzt="haus">Jetzt</button></div>
  <div class="zeile"><div><label for="beginn">Arbeitsbeginn</label><input type="time" id="beginn"></div><button type="button" data-jetzt="beginn">Jetzt</button></div>
  <div class="zeile"><div><label for="ende">Arbeitsende</label><input type="time" id="ende"></div><button type="button" data-jetzt="ende">Jetzt</button></div>
  <div class="zeile"><div><label for="zuhause">Ankunft zu Hause</label><input type="time" id="zuhause"></div><button type="button" data-jetzt="zuhause">Jetzt</button></div>

  <label for="pause">Pause (Min) – nur eintragen, wenn länger als 30</label>
  <input type="number" id="pause" inputmode="numeric" min="0" max="600" step="1" style="margin-bottom:12px">

  <label>Ziel des Tages</label>
  <div class="zwei" style="margin-bottom:12px">
    <button type="button" class="ziel" data-ziel="Büro" aria-pressed="false">Büro</button>
    <button type="button" class="ziel" data-ziel="Baustelle" aria-pressed="false">Baustelle</button>
  </div>
</div>

<button type="button" class="gross" id="speichern">Speichern</button>
<div id="meldung" role="status" aria-live="polite"></div>

<h2>Letzte Einträge</h2>
<p class="klein" id="summe" style="margin:0 0 4px"></p>
<div id="liste"></div>

<h2>Sicherung</h2>
<button type="button" class="sek" id="export" style="width:100%">Alle Einträge als CSV teilen</button>
<button type="button" class="sek" id="import" style="width:100%; margin-top:8px">CSV importieren</button>
<input type="file" id="importdatei" accept=".csv,text/csv" hidden>
<p class="klein">Die Einträge liegen nur auf diesem Handy. Gehen Browserdaten verloren oder wechselst du das Gerät, helfen nur die CSV-Sicherungen. Bitte regelmäßig exportieren.</p>

<script src="app.js"></script>
</body>
</html>

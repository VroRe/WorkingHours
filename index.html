<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7C1E1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkingHours">
<title>STUNDENERFASSUNG</title>
<style>
  @font-face { font-family: 'Montserrat'; src: url('Montserrat-Variable.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
  /* Farben nach der Farbskala: Bordeaux, Anthrazit, Grautöne; Altrosa, Pastellblau und Safran als Akzente */
  :root {
    --bg:#F7F7F5; --panel:#FFFFFF; --line:#D1D1D1; --ink:#1A1A1A; --mute:#777777;
    --rot:#7C1E1E; --rot-hell:#A41818; --anthrazit:#333333; --grau:#F4F4F4;
    --rosa:#C17B84; --rosa-bg:#F6EBED; --blau:#7FA9C4; --blau-bg:#ECF2F6; --safran:#E0A530; --safran-bg:#FAF2E0;
    --ok:#2E7D32; --ok-bg:#E8F5E9;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Montserrat', 'Segoe UI', Roboto, Arial, sans-serif; margin: 0 auto; padding: 14px 14px 40px; background: var(--bg); color: var(--ink); font-size: 15px; max-width: 560px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin: 6px 0 12px; color: var(--ink); }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--rot); padding-bottom: 6px; margin: 28px 0 10px; }
  label { display: block; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin-bottom: 5px; }
  input, select, button { font-family: inherit; font-size: 16px; }
  input[type=date], input[type=text], input[type=number], select {
    width: 100%; height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  input:focus, select:focus { outline: none; border-color: var(--rot); box-shadow: 0 0 0 1px var(--rot); }
  input:disabled, select:disabled { background: var(--grau); color: #aaa; }
  input.ungueltig { border-color: var(--rot-hell); background: var(--rosa-bg); }
  .zeile { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: end; margin-bottom: 12px; }
  button { min-height: 52px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font-weight: 600; letter-spacing: .03em; cursor: pointer; padding: 0 14px; }
  button:active { background: var(--grau); }
  button:disabled { color: #aaa; background: var(--grau); cursor: default; }
  .gross { width: 100%; min-height: 58px; background: var(--rot); border-color: var(--rot); color: #fff; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; margin-top: 8px; }
  .gross:active { background: #651818; }
  .sek { background: var(--panel); border: 1px solid var(--anthrazit); color: var(--anthrazit); }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ziel[aria-pressed=true] { background: var(--anthrazit); border-color: var(--anthrazit); color: #fff; }
  #meldung, #meldung2 { margin-top: 12px; padding: 12px 14px; border-radius: 0 6px 6px 0; display: none; font-size: 14px; border-left: 3px solid; }
  #meldung.ok, #meldung2.ok { display: block; background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  #meldung.fehler, #meldung2.fehler { display: block; background: var(--rosa-bg); color: var(--rot-hell); border-color: var(--rot-hell); }
  #meldung.info, #meldung2.info { display: block; background: var(--blau-bg); color: var(--anthrazit); border-color: var(--blau); }
  .eintrag { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .eintrag:first-child { border-top-left-radius: 6px; border-top-right-radius: 6px; }
  .eintrag:last-child { border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }
  .eintrag { padding: 8px 12px; }
  .eintrag .tag { font-size: 13px; font-weight: 600; }
  .eintrag .t { font-size: 11px; color: var(--mute); line-height: 1.45; }
  .eintrag button { min-height: 34px; font-size: 11px; padding: 0 10px; }
  .eintrag.frei { background: var(--grau); }
  .eintrag.feiertag { background: var(--safran-bg); box-shadow: inset 3px 0 0 var(--safran); }
  .klein { font-size: 12px; color: var(--mute); margin-top: 8px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; position: sticky; top: 0; background: var(--bg); padding: 0 0 10px; z-index: 5; border-bottom: 1px solid var(--line); }
  .tab { min-height: 46px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; background: transparent; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--mute); }
  .tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--rot); }
  .seite[hidden] { display: none; }
  .nav { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; text-align: center; font-weight: 600; letter-spacing: .04em; margin-top: 14px; }
  .nav button { padding: 0; font-size: 22px; }
  /* Eingabemaske: kompakt, damit sie ohne Scrollen auf einen Bildschirm passt */
  h1 { margin: 2px 0 8px; }
  .raster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 12px; margin-bottom: 8px; }
  .raster.eins { grid-template-columns: minmax(0, 1fr); }
  .raster input, .raster select { min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; }
  .raster input[type=date] { display: block; text-align: left; }
  .raster select { background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  .raster > div { min-width: 0; }
  #seite-eingabe label { margin-bottom: 3px; }
  #seite-eingabe input, #seite-eingabe select { height: 46px; }
  #seite-eingabe .zwei { gap: 6px; }
  #seite-eingabe .zwei button { min-height: 46px; padding: 0 4px; font-size: 13px; }
  #tagHinweis { margin: 0 0 8px; }
  #tagHinweis:empty { display: none; }
  .mit-jetzt { position: relative; }
  .mit-jetzt input { padding-right: 62px; }
  .mit-jetzt button { position: absolute; right: 5px; top: 5px; min-height: 0; height: 36px; width: 52px; padding: 0; font-size: 11px; background: var(--grau); border: 0; }
  #seite-eingabe .gross { margin-top: 4px; min-height: 52px; }
  .kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .kachel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
  .kachel.hero { border-left: 3px solid var(--rot); }
  .kachel .l { font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .kachel .w { font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
  .kachel .e { font-size: 12px; font-weight: 500; color: var(--mute); }
  .kachel .k { font-size: 11px; color: var(--mute); margin-top: 2px; overflow-wrap: anywhere; }
  .kacheln .leer { grid-column: 1 / -1; color: var(--mute); font-size: 13px; padding: 8px 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 10px 10px; }
  .legende { display: flex; gap: 16px; font-size: 11px; color: var(--mute); padding: 0 4px 6px; }
  .legende span { display: inline-flex; align-items: center; gap: 6px; }
  .lg-balken { width: 10px; height: 10px; background: var(--rot); border-radius: 2px 2px 0 0; }
  .lg-soll { width: 14px; height: 2px; background: var(--anthrazit); border-radius: 1px; }
  #wochenChart svg { width: 100%; height: auto; display: block; }
  #wochenChart svg rect[role=button]:focus { outline: none; stroke: var(--rot); stroke-width: 1; }
  .detail { font-size: 12px; color: var(--mute); border-top: 1px solid var(--line); margin-top: 6px; padding: 8px 4px 0; line-height: 1.5; }
  .detail b { color: var(--ink); font-weight: 600; }
  details.tabelle { margin-top: 4px; font-size: 12px; }
  details.tabelle summary { cursor: pointer; color: var(--mute); padding: 6px 0; }
  details.tabelle table { width: 100%; border-collapse: collapse; background: var(--panel); }
  details.tabelle th, details.tabelle td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  details.tabelle th:first-child, details.tabelle td:first-child { text-align: left; }
  details.tabelle th { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); font-weight: 500; }
  details.tabelle tr.fett td { font-weight: 600; }
  .eintrag.kompakt { display: block; padding: 3px 12px; font-size: 11px; color: var(--mute); cursor: pointer; line-height: 1.6; }
  .eintrag.kompakt.feiertag { color: var(--anthrazit); }
  .balken { position: relative; height: 4px; background: #E2E2E2; border-radius: 2px; margin-top: 6px; }
  .balken i { display: block; height: 100%; background: var(--rot); border-radius: 2px; }
  .balken.mitsoll::after { content: ''; position: absolute; left: 80%; top: -2px; width: 2px; height: 8px; background: var(--anthrazit); border-radius: 1px; }
</style>
</head>
<body>
<h1>WorkingHours</h1>
<div class="tabs" role="tablist">
  <button type="button" class="tab" id="tab-eingabe" role="tab" data-seite="eingabe" aria-selected="true">Eingabe</button>
  <button type="button" class="tab" id="tab-dashboard" role="tab" data-seite="dashboard" aria-selected="false">Dashboard</button>
</div>

<main id="seite-eingabe" class="seite">
<div class="raster eins">
  <div>
    <label for="datum">Datum</label>
    <input type="date" id="datum">
  </div>
  <div>
    <label for="abw">Abwesenheit</label>
    <select id="abw">
      <option value="">– keine –</option>
      <option value="Urlaub">Urlaub</option>
      <option value="Krank">Krank</option>
    </select>
  </div>
</div>
<p class="klein" id="tagHinweis"></p>

<div class="raster" id="zeiten">
  <div><label for="haus">Haus verlassen</label><div class="mit-jetzt"><input type="text" inputmode="numeric" autocomplete="off" placeholder="hh:mm" maxlength="5" id="haus"><button type="button" data-jetzt="haus">Jetzt</button></div></div>
  <div><label for="beginn">Arbeitsbeginn</label><div class="mit-jetzt"><input type="text" inputmode="numeric" autocomplete="off" placeholder="hh:mm" maxlength="5" id="beginn"><button type="button" data-jetzt="beginn">Jetzt</button></div></div>
  <div><label for="ende">Arbeitsende</label><div class="mit-jetzt"><input type="text" inputmode="numeric" autocomplete="off" placeholder="hh:mm" maxlength="5" id="ende"><button type="button" data-jetzt="ende">Jetzt</button></div></div>
  <div><label for="zuhause">Ankunft zu Hause</label><div class="mit-jetzt"><input type="text" inputmode="numeric" autocomplete="off" placeholder="hh:mm" maxlength="5" id="zuhause"><button type="button" data-jetzt="zuhause">Jetzt</button></div></div>
  <div>
    <label for="pause">Pause (Min), nur &gt; 30</label>
    <input type="number" id="pause" inputmode="numeric" min="0" max="600" step="1">
  </div>
  <div>
    <label>Ziel des Tages</label>
    <div class="zwei">
      <button type="button" class="ziel" data-ziel="Büro" aria-pressed="false">Büro</button>
      <button type="button" class="ziel" data-ziel="Baustelle" aria-pressed="false">Baustelle</button>
    </div>
  </div>
</div>

<button type="button" class="gross" id="speichern">Speichern</button>
<div id="meldung" role="status" aria-live="polite"></div>
</main>

<main id="seite-dashboard" class="seite" hidden>
<div class="nav">
  <button type="button" class="sek" id="monatZurueck" aria-label="Voriger Monat">‹</button>
  <div id="monatTitel"></div>
  <button type="button" class="sek" id="monatVor" aria-label="Nächster Monat">›</button>
</div>
<div class="kacheln" id="monatSumme"></div>

<h2>Stunden pro Woche</h2>
<div class="panel">
  <div class="legende">
    <span><i class="lg-balken"></i>Ist</span>
    <span><i class="lg-soll"></i>Soll (erfasste Tage)</span>
  </div>
  <div id="wochenChart"></div>
  <div class="detail" id="wochenDetail" aria-live="polite"></div>
</div>
<div class="kacheln" id="wochenSumme"></div>
<details class="tabelle">
  <summary>Als Tabelle anzeigen</summary>
  <div id="wochen"></div>
</details>

<h2>Urlaub und Krank</h2>
<div class="kacheln" id="urlaubJahr"></div>

<h2>Tage des Monats</h2>
<div id="liste"></div>

<h2>Sicherung</h2>
<button type="button" class="sek" id="export" style="width:100%">Alle Einträge als CSV teilen</button>
<button type="button" class="sek" id="import" style="width:100%; margin-top:8px">CSV importieren</button>
<input type="file" id="importdatei" accept=".csv,text/csv" hidden>
<div id="meldung2" role="status" aria-live="polite"></div>
<p class="klein">Die Einträge liegen nur auf diesem Handy. Gehen Browserdaten verloren oder wechselst du das Gerät, helfen nur die CSV-Sicherungen. Bitte regelmäßig exportieren.</p>
</main>

<script src="app.js"></script>
</body>
</html>
